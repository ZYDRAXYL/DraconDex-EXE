<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <!-- Content-Security-Policy. Must be a meta tag, not a webRequest header:
       this document is loaded with loadFile(), so it is a file:// page and has
       no HTTP response headers for onHeadersReceived to rewrite.

       Read this honestly: script-src needs 'unsafe-inline' because the boot
       script below is inline and the whole UI is built on inline onclick=
       handlers, so this policy does NOT stop inline-handler XSS. What it does
       buy is real all the same — connect-src 'none' means a compromised
       renderer has no way to phone data out (every network call in this app
       goes through window.api to the main process, so nothing legitimate
       breaks), remote <script src> can't be loaded, plugins/objects are off,
       and <base> can't be hijacked to re-point relative URLs.
       Tightening script-src further means migrating ~500 inline handlers to
       delegated listeners — a separate job, not a quick win. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob: ddx-file:;
    font-src 'self';
    media-src 'self' blob: ddx-file:;
    connect-src 'none';
    object-src 'none';
    frame-src 'none';
    base-uri 'none';
    form-action 'none';">

<script>
/* Boot splash. Runs before the ~700KB of app JS below parses — a synchronous
   script blocks paint, so everything here lands before the first frame. */
(function(){
  /* (a) Theme, early. body[data-theme] is normally set by applyUiSettings()
     (core.js), but that is the first line of init(), which only runs after all
     30 script tags have parsed — so a light-theme user got a black flash for
     the whole boot. This is a deliberately reduced copy: theme only, no --fsc /
     zoom / lang. applyUiSettings() stays authoritative and re-applies the lot a
     few hundred ms later, so anything guessed wrong here self-corrects. Keep the
     storage key and the 'midnight' default in sync with core.js. */
  try{
    var saved = JSON.parse(localStorage.getItem('novel-manager-ui-settings') || '{}');
    var theme = typeof saved.theme === 'string' ? saved.theme : 'midnight';
    if (theme.indexOf('custom:') === 0){
      var ct = (saved.customThemes || []).filter(function(c){ return 'custom:' + c.id === theme; })[0];
      document.body.dataset.theme = ct ? 'custom' : 'midnight';
      if (ct) for (var k in (ct.vars || {})) document.body.style.setProperty(k, ct.vars[k]);
    } else {
      document.body.dataset.theme = theme;
    }
  }catch(e){ document.body.dataset.theme = 'midnight'; }

  /* (a2) Workspace style, early — same reasoning as theme above (Plan part2
     #New Workspace): a real ?workspace= query param always wins, for manual
     QA, same idiom as boot.js's ?nexus=/?popup= reads. applyWorkspaceStyle()
     in boot.js re-applies authoritatively once S.settings exists. */
  try{
    var qsWorkspace = new URLSearchParams(location.search).get('workspace');
    var workspace = ['drake','wyvern','dragon'].indexOf(qsWorkspace) !== -1 ? qsWorkspace
      : (['drake','wyvern','dragon'].indexOf(saved.workspaceStyle) !== -1 ? saved.workspaceStyle : 'drake');
    document.body.dataset.workspace = workspace;
    /* (a3) Nav orientation, early (Process 5 part1) — same reasoning as (a2)
       above: a real reparent only happens once applyNavOrientation() (boot.js)
       runs, but the CSS this attribute drives (workspace.css) needs to be
       correct before first paint or a wide/tall #nav-sidebar in the wrong
       axis flashes for a frame. Defaults mirror NAV_ORIENTATION_DEFAULT
       (core/state.js) — keep the two in sync. */
    var navOrientDefault = { drake:'vertical', wyvern:'horizontal', dragon:'vertical' };
    var savedNavOrient = (saved.navOrientation || {})[workspace];
    document.body.dataset.navOrientation = (savedNavOrient === 'horizontal' || savedNavOrient === 'vertical')
      ? savedNavOrient : navOrientDefault[workspace];
    document.body.dataset.navDisplay = ['icon','label','both'].indexOf(saved.navHorizontalDisplay) !== -1
      ? saved.navHorizontalDisplay : 'both';
  }catch(e){ document.body.dataset.workspace = 'drake'; document.body.dataset.navOrientation = 'vertical'; document.body.dataset.navDisplay = 'both'; }

  /* (b) Progress controller. Ticks come from real checkpoints — the script tags
     below, then init() in core.js — never a timer pretending to be progress. */
  var born = Date.now(), pct = 0, over = false;
  function el(id){ return document.getElementById(id); }
  window.__splash = {
    set: function(n){
      if (over) return;
      pct = Math.max(pct, Math.min(100, n));
      var f = el('splash-fill'), p = el('splash-pct');
      if (f) f.style.width = pct + '%';
      if (p) p.textContent = pct + '%';
    },
    finish: function(){
      if (over) return;
      over = true;
      var s = el('splash'), f = el('splash-fill'), p = el('splash-pct');
      if (f) f.style.width = '100%';
      if (p) p.textContent = '100%';
      if (!s) return;
      /* Min on-screen time so a warm boot flashes the splash instead of
         strobing it, then fade (matches the .26s transition in style.css). */
      setTimeout(function(){
        s.classList.add('splash-hide');
        setTimeout(function(){ s.remove(); }, 320);
      }, Math.max(0, 500 - (Date.now() - born)));
    },
  };
  /* #splash is position:fixed/inset:0 — if boot dies before finish() it would
     swallow every click on the app underneath. Always leave an exit. */
  setTimeout(function(){ window.__splash.finish(); }, 20000);
})();
</script>
